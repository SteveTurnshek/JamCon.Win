name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests share a group per branch so a newer push cancels the older run. Pushes to main
  # each get their own group (the run id): a shared group would still cancel a run waiting in the
  # queue behind another, leaving a commit on main with no result.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # windows-latest is required: JamCon.Bluetooth, JamCon.Output, JamCon.App and
    # tools/Jc2Probe target net9.0-windows10.0.22621.0 and need the Windows SDK
    # projections. JamCon.Core and its tests are plain net9.0 by design.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore JamCon.Win.sln

      - name: Build
        run: dotnet build JamCon.Win.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JamCon.Win.sln --configuration Release --no-build --verbosity normal
